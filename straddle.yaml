# hw-waveshare-28b — board HAL straddle for the Waveshare ESP32-S3-Touch-LCD-2.8B.
#
# A plain (non-buildable) board component: it doesn't decide what the device
# DOES, it only makes the board usable by an app. The reticulous/reticulous
# buildable adds it with `--with spangap/hw-waveshare-28b` and inherits the
# board's pin map, bring-up hook and hardware kconfig.
#
# The 2.8B is an ESP32-S3R8 (16 MB flash, 8 MB octal PSRAM) behind a 2.8" 480x640
# IPS panel: an ST7701S driven over a 16-bit RGB parallel bus, GT911 touch,
# QMI8658 IMU, PCF85063 clock, microSD, a buzzer, a 3.7 V lithium connector with
# its own charger, and a PCA9554 IO expander carrying the lines that were left
# over. There is NO radio beyond the SoC's own WiFi and BLE — no LoRa, so
# iface-lora stays at its CONFIG_LORA_COUNT=0 default and compiles to nothing.
#
# What makes this board different from every other one here: nearly every pin is
# spoken for by the display. Sixteen data lines plus four sync signals leave one
# I2C bus (which four chips share), one two-wire channel (which the panel's
# configuration and the microSD share, in that order), one ADC pin and the
# expander. Every "shares its wires with" note below is that, and the board's
# onStart is what makes the sharing safe.
# Board reference: https://www.waveshare.com/wiki/ESP32-S3-Touch-LCD-2.8B
schema_version: 1
name: spangap/hw-waveshare-28b
prefix: waveshare28b
firmware: esp-idf
version: 0.0.0
platforms: [idf]
# What this board pulls in: the on-device LCD UI, because the 2.8B is a screen
# with a computer behind it — drop it with --no-lcd and the board is a headless
# ESP32-S3 — plus the three sensor straddles for the parts soldered to its I2C
# bus. All are soft installs: a build that doesn't want one drops it with
# --without and the gated kconfig: blocks below go with it.
additional_installs:
  - spangap/spangap-lcd
  - spangap/spangap-rtc
  - spangap/imu
# Board bring-up as registered Services. app_main is generated by the buildable;
# it constructs these in listed order and walks them (onStart before spangapInit,
# onInit after).
#   Waveshare28bBoard.onStart — bare hardware, and it MUST run first and whole:
#     the board I2C bus (which the touch, RTC and IMU straddles then adopt by
#     port), the PCA9554 expander (which holds both resets and both chip-
#     selects), the ST7701S register sequence over pins the microSD is about to
#     take, and finally the card's chip-select. spangapInit()'s fs_mount_sd
#     depends on the last of those; every adopting straddle depends on the
#     first. Its onInit publishes sys.board, which needs storage.
#   Waveshare28bBattery.onInit — 1/min esp_timer publishing battery.millivolt /
#     battery.percent. Always on — no UI dependency.
# There is no input-HAL service: this board has no keyboard, no trackball and no
# button an operator can reach (BOOT is under the case), so the glass is the
# whole of its input and that is spangap-lcd's own GT911 controller.
services:
  - { class: Waveshare28bBoard,   header: waveshare28b.h }
  - { class: Waveshare28bBattery, header: waveshare28b.h }

# Declarative settings: the board's rows on the System page. What this board
# offers is device-wide, not a program, so it lands on System; the orders put
# Hardware and Display at the top, ahead of the unordered blocks the platform
# straddles contribute there. The Display rows join the section spangap-lcd
# opens — section titles merge on an exact match. s.lcd.* rows are defaultless:
# those defaults are owned by spangap-lcd; this block only surfaces the keys.
#
# There is no "wake on touch" switch here, unlike the boards that have a button.
# The key exists (seeded y by the kconfig below) but turning it off on a board
# with no reachable button would leave nothing that can wake the device — a row
# whose only wrong setting is unrecoverable is a row better not offered.
settings:
  - at: [ { id: system } ]
    order: 10
    rows:
      - section: "Hardware"
      - info:
          rows:
            - value:  { label: "Board", key: "sys.board" }
            - value:  { label: "Touch", key: "lcd.touch" }
  - at: [ { id: system } ]
    order: 20
    rows:
      - section: "Display"
      - slider: { label: "Backlight",      key: "s.lcd.backlight",          min: 0, max: 255 }
      - integer: { label: "Dim after", unit: "s",  key: "s.lcd.inactivity_timeout", min: 0, max: 120 }
      - caption: "Touch the screen to wake it."

# Board VALUES, fed to the symbols other straddles / IDF DEFINE through the
# collected staging/sdkconfig.spangap-fragments. A board straddle is non-
# buildable, so its sdkconfig.defaults would be IGNORED — everything that
# describes this hardware MUST live here in kconfig: to survive `--with`.
kconfig:
  # Board memory: ESP32-S3R8 — 16 MB flash, 8 MB OCTAL PSRAM. The octal part is
  # not a detail here: the panel's DMA reads a 600 KB framebuffer out of PSRAM
  # about forty times a second, which quad PSRAM has no bandwidth for.
  #   * FLASHSIZE — the flash CONTAINER / bootloader-header size, pinned to the
  #     real 16 MB chip.
  #   * MAX_FIRMWARE_KB — the offset where the runtime read-write /state
  #     partition begins; /state fills the rest of the chip (~8 MB here). Same
  #     split as the T-Deck and the TAP V2, the other 16 MB screen boards.
  # Changing MAX_FIRMWARE_KB relocates /state → existing devices factory-reset
  # on the next boot, so warn users before bumping it.
  - CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
  - CONFIG_SPANGAP_MAX_FIRMWARE_KB=8192
  - CONFIG_SPIRAM_MODE_OCT=y
  # microSD on SPI host 2, sharing SCK/MOSI with the ST7701S's configuration
  # channel — which is finished with them before spangapInit() gets here (see
  # waveshare28b.cpp). NO CHIP-SELECT PIN: the card's select is on the IO
  # expander, where a per-transaction toggle would cost an I2C round trip, so
  # the board asserts it once at the end of onStart and leaves it asserted. That
  # is what -1 means to spangap-core's sdspi host: drive no select line.
  - CONFIG_SPANGAP_SDCARD=y
  - CONFIG_SPANGAP_SDCARD_BUS_SPI=y
  - CONFIG_SPANGAP_SDCARD_SPI_HOST=2
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_CS=-1
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_SCK=2
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_MOSI=1
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_MISO=42
  # Display — 2.8" 480x640 IPS, ST7701S over a 16-bit RGB parallel bus. Held
  # LANDSCAPE, at 640x480: the glass is taller than it is wide and the shell —
  # a title row, a keyboard under a text field — wants the other proportion. An
  # RGB panel is scanned out in the glass's own order and has no rotation to
  # ask for, so spangap-lcd transposes each rendered strip on its way into the
  # framebuffer; the timings below stay native, because they are the glass.
  # The rotation here is the SHIPPED value of s.lcd.rotation, which the operator
  # changes on System → Display (all four turns, applied on the next boot).
  # The controller's own registers are NOT
  # configured here — they are written by the board's onStart over the panel's
  # 3-wire SPI, because that channel's chip-select is on the IO expander and its
  # other two wires are the microSD's. Inert when --no-lcd.
  - CONFIG_LCD_BUS_RGB=y
  - CONFIG_LCD_NATIVE_WIDTH=480
  - CONFIG_LCD_NATIVE_HEIGHT=640
  - CONFIG_LCD_ROTATION_270=y
  - CONFIG_LCD_BL_PIN=6
  # Sync and data. The data lines are named for the BIT they carry, low to high
  # per colour; Waveshare's own table names the same pins B1..B5 / G0..G5 /
  # R1..R5, an 18-bit panel's naming with the two unused LSBs left off.
  - CONFIG_LCD_RGB_HSYNC_PIN=38
  - CONFIG_LCD_RGB_VSYNC_PIN=39
  - CONFIG_LCD_RGB_DE_PIN=40
  - CONFIG_LCD_RGB_PCLK_PIN=41
  - CONFIG_LCD_RGB_B0_PIN=5
  - CONFIG_LCD_RGB_B1_PIN=45
  - CONFIG_LCD_RGB_B2_PIN=48
  - CONFIG_LCD_RGB_B3_PIN=47
  - CONFIG_LCD_RGB_B4_PIN=21
  - CONFIG_LCD_RGB_G0_PIN=14
  - CONFIG_LCD_RGB_G1_PIN=13
  - CONFIG_LCD_RGB_G2_PIN=12
  - CONFIG_LCD_RGB_G3_PIN=11
  - CONFIG_LCD_RGB_G4_PIN=10
  - CONFIG_LCD_RGB_G5_PIN=9
  - CONFIG_LCD_RGB_R0_PIN=46
  - CONFIG_LCD_RGB_R1_PIN=3
  - CONFIG_LCD_RGB_R2_PIN=8
  - CONFIG_LCD_RGB_R3_PIN=18
  - CONFIG_LCD_RGB_R4_PIN=17
  # Timing. 16 MHz on the RISING edge over a 620x690 total frame is ~37 Hz and
  # ~32 MB/s of PSRAM read. These are the numbers this glass was seen to run a
  # clean picture on, and they are not the numbers Waveshare's configuration for
  # the sibling 2.8C carries (548x659, h 8/10/50, v 3/8/8) — that panel's
  # porches were tried here and the picture would not hold still. A working
  # timing set is evidence and a documented one is a hypothesis; when they
  # disagree, this file keeps the evidence.
  #
  # `panel pclk` and `panel restart` on a running device are how any of this is
  # questioned again, rather than a build at a time.
  - CONFIG_LCD_PCLK_MHZ=16
  - CONFIG_LCD_RGB_HSYNC_PULSE=10
  - CONFIG_LCD_RGB_HSYNC_BACK=70
  - CONFIG_LCD_RGB_HSYNC_FRONT=60
  - CONFIG_LCD_RGB_VSYNC_PULSE=10
  - CONFIG_LCD_RGB_VSYNC_BACK=20
  - CONFIG_LCD_RGB_VSYNC_FRONT=20
  # 80 lines of strip is 75 KB of PSRAM and a tenth of the screen per flush.
  #
  # BOUNCE BUFFERS ARE ON, and on this board they are not a tuning preference —
  # the picture walks down the glass without them, repeatably. Two things go
  # wrong at once when the panel's DMA reads the framebuffer straight out of
  # PSRAM: it queues behind every cache miss the CPU takes, and esp_lcd, with no
  # bounce buffer to sync instead, writes back the WHOLE 600 KB framebuffer's
  # worth of cache lines on every flush. A starved RGB panel does not glitch and
  # recover — the frame starts in the wrong place and stays there.
  #
  # Bouncing removes both: the DMA reads internal RAM, which nothing contends
  # for, and the refill reads the framebuffer through the cache, so coherency is
  # free and esp_lcd skips the sync entirely. The refill is CPU work against a
  # deadline — 9.4 KB every 0.7 ms — and it meets it at 80 MHz, so nothing here
  # pins the clock (spangap-lcd's `panel cpu 1` does, for a board that needs it).
  # Ten lines is 9.4 KB of internal RAM per buffer, two of them, and it divides
  # the framebuffer evenly, which esp_lcd requires.
  - CONFIG_LCD_RGB_DRAW_LINES=80
  - CONFIG_LCD_RGB_BOUNCE_LINES=10
  # UI zoom. This panel is 2.8" at 480x640 — about 285 ppi, twice the density of
  # the 2.8" 320x240 decks the shell's proportions were drawn against. 200%
  # would make it physically identical to those; 175% is what this glass reads
  # comfortably at, held at arm's length, and it is one of the steps the UI Zoom
  # row offers — a shipped value that is not on that list would show up there as
  # no selection at all. It is the operator's to change (System → Display).
  - CONFIG_LCD_UI_SCALE_DEFAULT=175
  # Touch — GT911 on the board's own I2C bus, brought up by the lcd component
  # (its CONFIG_LCD_TOUCH_* controller; the board contributes no touch code).
  # ADOPT, not create: three other chips are on those wires and the board's
  # onStart made the bus. The reset line is on the IO expander, so no RST pin
  # here — onStart pulses it before the display comes up. The glass is laminated
  # in the panel's own orientation, so no swap or mirror.
  - when: spangap/spangap-lcd
    set:
      - CONFIG_LCD_TOUCH_CONTROLLER_GT911=y
      - CONFIG_LCD_TOUCH_I2C_PORT=0
      - CONFIG_LCD_TOUCH_I2C_ADOPT=y
      - CONFIG_LCD_TOUCH_I2C_SDA=15
      - CONFIG_LCD_TOUCH_I2C_SCL=7
      - CONFIG_LCD_TOUCH_I2C_KHZ=400
      - CONFIG_LCD_TOUCH_INT_PIN=16
      - CONFIG_LCD_TOUCH_RST_PIN=-1
      # The controller is asked as well as watched. GPIO 16 is the only pin this
      # board leaves free for the touch interrupt, and the part answers on the
      # bus — but nothing here has yet seen an edge on that line, and a board
      # whose glass is its whole input cannot wait on one. 50 ms is a fifth of
      # the time a tap lasts, so nothing is missed by asking at that rate.
      - CONFIG_LCD_TOUCH_POLL_MS=50
      # The glass is the only way to wake this board: BOOT is the sole button
      # and it is not reachable in use.
      - CONFIG_LCD_WAKE_ON_TOUCH_DEFAULT=y
  # PCF85063 wall clock (consumed by spangap/spangap-rtc, staged above), on the
  # board's shared I2C bus — adopted by port, like everything else on those two
  # wires. Its interrupt goes to the IO expander and nothing reads it.
  - when: spangap/spangap-rtc
    set:
      - CONFIG_RTC_CHIP_PCF85063=y
      - CONFIG_RTC_I2C_SDA_PIN=15
      - CONFIG_RTC_I2C_SCL_PIN=7
      - CONFIG_RTC_I2C_PORT=0
  # QMI8658 IMU (consumed by spangap/imu, staged above), also on the shared I2C
  # bus, at 0x6B. Both of its interrupt outputs land on the IO expander rather
  # than on a pin, so there is no CONFIG_IMU_INT_PIN to give: the straddle polls
  # the part's latched status, which is what clears it anyway.
  - when: spangap/imu
    set:
      - CONFIG_IMU_BUS_I2C=y
      - CONFIG_IMU_I2C_SDA_PIN=15
      - CONFIG_IMU_I2C_SCL_PIN=7
      - CONFIG_IMU_I2C_PORT=0
      - CONFIG_IMU_I2C_ADDR=0x6B
      - CONFIG_IMU_INT_PIN=-1
  # LVGL v9 tuning, matching the platform's other screen boards: 16-bit colour
  # matches the panel, Montserrat 12 for launcher labels, and LVGL allocations
  # route through spangap's central policy (LV_USE_CUSTOM_MALLOC).
  - CONFIG_LV_COLOR_DEPTH_16=y
  - CONFIG_LV_USE_CUSTOM_MALLOC=y
  - CONFIG_LV_USE_CLIB_STRING=y
  - CONFIG_LV_FONT_MONTSERRAT_12=y
